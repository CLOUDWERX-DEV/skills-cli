name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: The command and its output
      render: sh
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `skills --version`
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Output of `skills config show`
      render: text
  - type: input
    id: system
    attributes:
      label: Distro and shell
